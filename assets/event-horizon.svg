<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Animated event horizon: a photon ring in the void">
  <defs>
    <linearGradient id="ehRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb26b" stop-opacity="0"/>
      <stop offset="0.30" stop-color="#ffd7a8" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#fff4e6" stop-opacity="1"/>
      <stop offset="0.80" stop-color="#ffb26b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8a4a1f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ehHaze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb26b" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#c96a34" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <filter id="ehGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="ehSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="#05060a"/>

  <g fill="#fff4e6">
    <circle cx="90" cy="48" r="1" opacity="0.16">
      <animate attributeName="opacity" values="0.10;0.42;0.10" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="212" cy="196" r="0.8" opacity="0.14">
      <animate attributeName="opacity" values="0.08;0.34;0.08" dur="4.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="62" r="1.1" opacity="0.18">
      <animate attributeName="opacity" values="0.12;0.48;0.12" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="214" r="0.7" opacity="0.12">
      <animate attributeName="opacity" values="0.06;0.30;0.06" dur="5.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="40" r="0.9" opacity="0.16">
      <animate attributeName="opacity" values="0.10;0.40;0.10" dur="3.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="52" r="1" opacity="0.14">
      <animate attributeName="opacity" values="0.08;0.36;0.08" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1104" cy="188" r="0.8" opacity="0.16">
      <animate attributeName="opacity" values="0.10;0.42;0.10" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="228" r="1" opacity="0.12">
      <animate attributeName="opacity" values="0.06;0.32;0.06" dur="5.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="150" r="0.7" opacity="0.12">
      <animate attributeName="opacity" values="0.06;0.28;0.06" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <ellipse cx="880" cy="130" rx="330" ry="150" fill="url(#ehHaze)">
    <animate attributeName="opacity" values="0.70;1;0.70" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </ellipse>

  <g transform="translate(880 130)">
    <circle r="104" fill="none" stroke="url(#ehRing)" stroke-width="7" filter="url(#ehSoft)" opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.90;0.35" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="stroke-width" values="6;8.5;6" dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>
    <path d="M -104 0 A 104 104 0 0 1 104 0" fill="none" stroke="url(#ehRing)" stroke-width="2.4" opacity="0.7">
      <animate attributeName="opacity" values="0.70;1;0.70" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </path>
    <path d="M -104 0 A 104 104 0 0 0 104 0" fill="none" stroke="#8a4a1f" stroke-width="1.6" opacity="0.35">
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </path>
    <circle r="104" fill="none" stroke="#fff4e6" stroke-width="1" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.40;0.15" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>
    <circle r="86" fill="#05060a" opacity="0.82"/>
    <circle r="86" fill="none" stroke="#2a2118" stroke-width="1" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.60;0.35" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>
  </g>

  <g>
    <animateMotion dur="14s" repeatCount="indefinite" path="M 984 130 A 104 104 0 1 1 776 130 A 104 104 0 1 1 984 130"/>
    <circle cx="0" cy="0" r="3" fill="#fffaf2" filter="url(#ehGlow)"/>
  </g>

  <g>
    <animateMotion dur="9s" repeatCount="indefinite" path="M -80 46 L 1280 214"/>
    <animate attributeName="opacity" values="0;0.32;0.32;0" keyTimes="0;0.25;0.7;1" dur="9s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="46" ry="1.4" fill="#ffb26b" transform="rotate(9 0 0)"/>
  </g>

  <g>
    <animateMotion dur="13s" repeatCount="indefinite" path="M 1280 70 L -80 196"/>
    <animate attributeName="opacity" values="0;0.24;0.24;0" keyTimes="0;0.25;0.7;1" dur="13s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="34" ry="1.2" fill="#c96a34" transform="rotate(6 0 0)"/>
  </g>
</svg>
